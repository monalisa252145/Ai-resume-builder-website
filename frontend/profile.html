<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ResumeAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <a href="dashboard.html" class="animated-logo-box">
                    <span class="logo-text">ResumeAI</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
                <a href="builder.html"><span class="icon">✏️</span> Resume Builder</a>
                <a href="templates.html"><span class="icon">🎨</span> Templates</a>
                <a href="analyzer.html"><span class="icon">📊</span> ATS Analyzer</a>
                <a href="profile.html" class="active"><span class="icon">👤</span> Profile</a>
                <a href="help.html"><span class="icon">❓</span> Help</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger btn-sm" style="width:100%;" onclick="logout()">🚪 Logout</button>
            </div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <span class="topbar-title">My Profile</span>
            </header>

            <main class="page-content">
                <div class="page-header">
                    <h1>👤 My Profile</h1>
                    <p>Manage your account information</p>
                </div>

                <div style="max-width: 600px;">
                    <div class="card" style="text-align: center; margin-bottom: 24px;">
                        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #4f46e5, #06b6d4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; font-weight: 700; margin: 0 auto 16px;" id="profileAvatar">A</div>
                        <h2 id="profileName" style="font-size: 20px; font-weight: 700;">Loading...</h2>
                        <p id="profileEmail" style="color: #64748b;">Loading...</p>
                        <p id="profileSince" style="color: #94a3b8; font-size: 13px; margin-top: 4px;"></p>
                    </div>

                    <div class="card" style="margin-bottom: 24px;">
                        <h3 style="margin-bottom: 20px; font-size: 16px; font-weight: 600;">Account Information</h3>
                        <div id="profileAlert"></div>
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="editName" placeholder="Your name">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="editEmail" placeholder="Your email" readonly style="background: #f8fafc; cursor: not-allowed;">
                            <small style="color: #94a3b8; font-size: 12px;">Email cannot be changed</small>
                        </div>
                        <button class="btn btn-primary" onclick="updateProfile()">Save Changes</button>
                    </div>

                    <div class="card" style="border: 1px solid #fee2e2;">
                        <h3 style="margin-bottom: 8px; font-size: 16px; font-weight: 600; color: #991b1b;">⚠️ Danger Zone</h3>
                        <p style="color: #64748b; font-size: 14px; margin-bottom: 16px;">Logout from your account on this device.</p>
                        <button class="btn btn-danger" onclick="logout()">Logout</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.name) {
            document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = user.name;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('editName').value = user.name;
            document.getElementById('editEmail').value = user.email;
        }
        function updateProfile() {
            const name = document.getElementById('editName').value.trim();
            if (!name) { showProfileAlert('Name cannot be empty', 'error'); return; }
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            user.name = name;
            localStorage.setItem('user', JSON.stringify(user));
            document.getElementById('profileName').textContent = name;
            document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
            showProfileAlert('Profile updated locally. Backend profile update coming soon.', 'success');
        }
        function showProfileAlert(msg, type) {
            document.getElementById('profileAlert').innerHTML = `<div class="alert alert-${type === 'error' ? 'error' : 'success'}">${msg}</div>`;
            setTimeout(() => { document.getElementById('profileAlert').innerHTML = ''; }, 3000);
        }
    </script>
</body>
</html>
